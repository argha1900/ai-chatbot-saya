<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Sketsa Gambar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            margin-bottom: 30px;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #666;
            font-size: 0.9em;
        }

        #fileInput {
            display: none;
        }

        .controls {
            margin: 30px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-weight: 600;
            color: #333;
            font-size: 0.9em;
        }

        .slider {
            width: 200px;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .value-display {
            font-weight: 600;
            color: #667eea;
            font-size: 0.9em;
        }

        #invertCheckbox {
            width: 20px;
            height: 20px;
            accent-color: #667eea;
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .image-container {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .image-box {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }

        .image-box h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .image-preview {
            width: 100%;
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            background: #f5f5f5;
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 15px;
            color: #666;
            font-weight: 600;
        }

        .download-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .download-btn:hover {
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #c3e6cb;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .image-container {
                flex-direction: column;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .slider {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Generator Sketsa Gambar</h1>
        <p class="subtitle">Ubah foto Anda menjadi sketsa untuk memudahkan proses menggambar</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Klik atau seret gambar ke sini</div>
            <div class="upload-hint">Format yang didukung: JPG, PNG, GIF</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="controls" id="controls" style="display: none;">
            <div class="control-group">
                <label for="thresholdSlider">Sensitivitas Garis</label>
                <input type="range" id="thresholdSlider" class="slider" min="10" max="100" value="30">
                <div class="value-display" id="thresholdValue">30</div>
            </div>
            
            <div class="control-group">
                <label for="blurSlider">Kehalusan</label>
                <input type="range" id="blurSlider" class="slider" min="0" max="3" value="0.5" step="0.1">
                <div class="value-display" id="blurValue">0.5</div>
            </div>
            
            <div class="control-group">
                <label for="invertCheckbox">Garis Hitam</label>
                <input type="checkbox" id="invertCheckbox" checked>
                <div class="value-display">✓ Aktif</div>
            </div>
        </div>

        <button class="btn" id="generateBtn" style="display: none;">Generate Sketsa</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Memproses gambar...</div>
        </div>

        <div class="image-container" id="imageContainer" style="display: none;">
            <div class="image-box">
                <h3>Gambar Asli</h3>
                <img id="originalImage" class="image-preview" alt="Gambar asli">
            </div>
            <div class="image-box">
                <h3>Hasil Sketsa</h3>
                <img id="sketchImage" class="image-preview" alt="Hasil sketsa">
            </div>
        </div>

        <button class="btn download-btn" id="downloadBtn" style="display: none;">Download Sketsa</button>

        <div id="message"></div>
    </div>

    <script>
        class SketchGenerator {
            constructor() {
                this.originalImage = null;
                this.sketchImage = null;
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.initializeElements();
                this.setupEventListeners();
            }

            initializeElements() {
                this.uploadArea = document.getElementById('uploadArea');
                this.fileInput = document.getElementById('fileInput');
                this.controls = document.getElementById('controls');
                this.generateBtn = document.getElementById('generateBtn');
                this.loading = document.getElementById('loading');
                this.imageContainer = document.getElementById('imageContainer');
                this.originalImage = document.getElementById('originalImage');
                this.sketchImage = document.getElementById('sketchImage');
                this.downloadBtn = document.getElementById('downloadBtn');
                this.message = document.getElementById('message');
                
                this.thresholdSlider = document.getElementById('thresholdSlider');
                this.blurSlider = document.getElementById('blurSlider');
                this.invertCheckbox = document.getElementById('invertCheckbox');
                this.thresholdValue = document.getElementById('thresholdValue');
                this.blurValue = document.getElementById('blurValue');
            }

            setupEventListeners() {
                // Upload area events
                this.uploadArea.addEventListener('click', () => this.fileInput.click());
                this.uploadArea.addEventListener('dragover', this.handleDragOver.bind(this));
                this.uploadArea.addEventListener('dragleave', this.handleDragLeave.bind(this));
                this.uploadArea.addEventListener('drop', this.handleDrop.bind(this));
                
                // File input event
                this.fileInput.addEventListener('change', this.handleFileSelect.bind(this));
                
                // Generate button
                this.generateBtn.addEventListener('click', this.generateSketch.bind(this));
                
                // Download button
                this.downloadBtn.addEventListener('click', this.downloadSketch.bind(this));
                
                // Slider events
                this.thresholdSlider.addEventListener('input', this.updateThresholdValue.bind(this));
                this.blurSlider.addEventListener('input', this.updateBlurValue.bind(this));
                this.invertCheckbox.addEventListener('change', this.updateInvertValue.bind(this));
            }

            handleDragOver(e) {
                e.preventDefault();
                this.uploadArea.classList.add('dragover');
            }

            handleDragLeave(e) {
                e.preventDefault();
                this.uploadArea.classList.remove('dragover');
            }

            handleDrop(e) {
                e.preventDefault();
                this.uploadArea.classList.remove('dragover');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    this.processFile(files[0]);
                }
            }

            handleFileSelect(e) {
                const file = e.target.files[0];
                if (file) {
                    this.processFile(file);
                }
            }

            processFile(file) {
                if (!file.type.startsWith('image/')) {
                    this.showMessage('Silakan pilih file gambar yang valid!', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    this.loadImage(e.target.result);
                };
                reader.readAsDataURL(file);
            }

            loadImage(src) {
                const img = new Image();
                img.onload = () => {
                    this.originalImage.src = src;
                    this.originalImageData = img;
                    this.showControls();
                    this.showMessage('Gambar berhasil dimuat! Sesuaikan pengaturan dan klik Generate Sketsa.', 'success');
                };
                img.onerror = () => {
                    this.showMessage('Gagal memuat gambar!', 'error');
                };
                img.src = src;
            }

            showControls() {
                this.controls.style.display = 'flex';
                this.generateBtn.style.display = 'block';
                this.imageContainer.style.display = 'flex';
            }

            updateThresholdValue() {
                this.thresholdValue.textContent = this.thresholdSlider.value;
            }

            updateBlurValue() {
                this.blurValue.textContent = parseFloat(this.blurSlider.value).toFixed(1);
            }

            updateInvertValue() {
                const invertValue = document.querySelector('#invertCheckbox + .value-display');
                invertValue.textContent = this.invertCheckbox.checked ? '✓ Aktif' : '✗ Tidak Aktif';
            }

            generateSketch() {
                if (!this.originalImageData) {
                    this.showMessage('Silakan pilih gambar terlebih dahulu!', 'error');
                    return;
                }

                this.showLoading(true);
                
                // Simulate processing time for better UX
                setTimeout(() => {
                    try {
                        this.processSketch();
                        this.showLoading(false);
                        this.showMessage('Sketsa berhasil dibuat!', 'success');
                        this.downloadBtn.style.display = 'block';
                    } catch (error) {
                        this.showLoading(false);
                        this.showMessage('Terjadi kesalahan saat memproses gambar!', 'error');
                        console.error('Error generating sketch:', error);
                    }
                }, 500);
            }

            processSketch() {
                const img = this.originalImageData;
                const threshold = parseInt(this.thresholdSlider.value);
                const blur = parseFloat(this.blurSlider.value);
                
                // Set canvas size
                this.canvas.width = img.width;
                this.canvas.height = img.height;
                
                // Draw original image
                this.ctx.drawImage(img, 0, 0);
                
                // Get image data
                const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                const data = imageData.data;
                
                // Convert to grayscale first
                const grayData = new Uint8Array(this.canvas.width * this.canvas.height);
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                    grayData[i / 4] = gray;
                }
                
                // Apply Sobel edge detection
                const edgeData = this.applySobelEdgeDetection(grayData, this.canvas.width, this.canvas.height);
                
                // Apply threshold and create sketch
                for (let i = 0; i < data.length; i += 4) {
                    const edgeValue = edgeData[i / 4];
                    const invert = this.invertCheckbox.checked;
                    
                    // Determine sketch value based on edge detection and invert option
                    let sketchValue;
                    if (invert) {
                        // Garis hitam di background putih
                        sketchValue = edgeValue > threshold ? 0 : 255;
                    } else {
                        // Garis putih di background hitam
                        sketchValue = edgeValue > threshold ? 255 : 0;
                    }
                    
                    data[i] = sketchValue;     // Red
                    data[i + 1] = sketchValue; // Green
                    data[i + 2] = sketchValue; // Blue
                    // Alpha channel remains unchanged
                }
                
                // Apply slight blur for smoother lines
                if (blur > 0) {
                    this.ctx.putImageData(imageData, 0, 0);
                    this.ctx.filter = `blur(${blur}px)`;
                    this.ctx.drawImage(this.canvas, 0, 0);
                    this.ctx.filter = 'none';
                } else {
                    this.ctx.putImageData(imageData, 0, 0);
                }
                
                // Display result
                this.sketchImage.src = this.canvas.toDataURL();
            }

            applySobelEdgeDetection(grayData, width, height) {
                const edgeData = new Uint8Array(width * height);
                
                // Sobel kernels
                const sobelX = [
                    [-1, 0, 1],
                    [-2, 0, 2],
                    [-1, 0, 1]
                ];
                
                const sobelY = [
                    [-1, -2, -1],
                    [0, 0, 0],
                    [1, 2, 1]
                ];
                
                // Apply Gaussian blur first for smoother edges
                const blurredData = this.applyGaussianBlur(grayData, width, height, 1);
                
                for (let y = 1; y < height - 1; y++) {
                    for (let x = 1; x < width - 1; x++) {
                        let gx = 0, gy = 0;
                        
                        // Apply Sobel kernels
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                const pixelValue = blurredData[(y + ky) * width + (x + kx)];
                                gx += pixelValue * sobelX[ky + 1][kx + 1];
                                gy += pixelValue * sobelY[ky + 1][kx + 1];
                            }
                        }
                        
                        // Calculate gradient magnitude
                        const magnitude = Math.sqrt(gx * gx + gy * gy);
                        edgeData[y * width + x] = Math.min(255, magnitude);
                    }
                }
                
                return edgeData;
            }

            applyGaussianBlur(grayData, width, height, radius) {
                const blurredData = new Uint8Array(width * height);
                const sigma = radius / 3;
                const kernelSize = Math.ceil(radius * 2) + 1;
                const kernel = this.createGaussianKernel(kernelSize, sigma);
                
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        let sum = 0;
                        let weightSum = 0;
                        
                        for (let ky = -Math.floor(kernelSize / 2); ky <= Math.floor(kernelSize / 2); ky++) {
                            for (let kx = -Math.floor(kernelSize / 2); kx <= Math.floor(kernelSize / 2); kx++) {
                                const px = Math.max(0, Math.min(width - 1, x + kx));
                                const py = Math.max(0, Math.min(height - 1, y + ky));
                                const weight = kernel[ky + Math.floor(kernelSize / 2)][kx + Math.floor(kernelSize / 2)];
                                
                                sum += grayData[py * width + px] * weight;
                                weightSum += weight;
                            }
                        }
                        
                        blurredData[y * width + x] = sum / weightSum;
                    }
                }
                
                return blurredData;
            }

            createGaussianKernel(size, sigma) {
                const kernel = Array(size).fill().map(() => Array(size).fill(0));
                const center = Math.floor(size / 2);
                let sum = 0;
                
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const dx = x - center;
                        const dy = y - center;
                        const value = Math.exp(-(dx * dx + dy * dy) / (2 * sigma * sigma));
                        kernel[y][x] = value;
                        sum += value;
                    }
                }
                
                // Normalize kernel
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        kernel[y][x] /= sum;
                    }
                }
                
                return kernel;
            }

            showLoading(show) {
                this.loading.style.display = show ? 'block' : 'none';
                this.generateBtn.disabled = show;
            }

            showMessage(text, type) {
                this.message.innerHTML = `<div class="${type}">${text}</div>`;
                setTimeout(() => {
                    this.message.innerHTML = '';
                }, 5000);
            }

            downloadSketch() {
                if (!this.sketchImage.src) {
                    this.showMessage('Tidak ada sketsa untuk diunduh!', 'error');
                    return;
                }

                const link = document.createElement('a');
                link.download = 'sketsa-gambar.png';
                link.href = this.sketchImage.src;
                link.click();
                
                this.showMessage('Sketsa berhasil diunduh!', 'success');
            }
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            new SketchGenerator();
        });
    </script>
</body>
</html>
